name: Publish npm Package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run (rehearsal only; no commit, tag, or push)"
        type: boolean
        default: true

# Deny all permissions at the workflow level; jobs request only what they need.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  verify:
    name: verify
    # WHY: Release gate mirroring ci.yml to ensure every release is fully verified
    # against both supported Node versions before minting tokens or publishing.
    # Keep this job in sync with the check job in ci.yml.
    runs-on: ubuntu-latest
    permissions:
      contents: read # WHY: read repository contents to run checks
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          # WHY: do not use cache: npm here. Avoid cache poisoning in a release workflow.

      - run: npm ci --no-audit --no-fund

      - name: Verify registry signatures
        # WHY: checks registry signatures and provenance attestations of every installed package.
        run: npm audit signatures

      - name: Audit production dependencies
        # WHY: same gate as ci.yml; only runtime dependencies reach users.
        if: matrix.node-version == 22
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Test
        if: matrix.node-version != 22
        run: npm test

      - name: Tarball sanity check
        run: npm pack --dry-run

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # WHY: commit the version bump and push git tags / release commits back to main
      id-token: write # WHY: mint Sigstore provenance attestations for npm OIDC Trusted Publishing
    timeout-minutes: 15
    env:
      # DRY_RUN is true only when manually dispatched with dry_run=true.
      # Push events or dispatch with dry_run=false evaluate to false.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Validate dispatch target
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_REF" != "refs/heads/main" ]; then
            echo "::error::Manual release dispatch with dry_run=false is only allowed on refs/heads/main (got ${EVENT_REF})"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # WHY: Node 24 LTS bundles npm >= 11.6.1, covering the npm >= 11.5.1 needed for Trusted Publishing
          # without an unpinned global npm install (satisfies OpenSSF Scorecard Pinned-Dependencies check).
          # The verify job already tests Node 24.
          # WHY: do not use cache: npm here. Avoid cache poisoning in a release workflow.

      - name: Verify npm version supports OIDC Trusted Publishing
        run: |
          # WHY: OIDC Trusted Publishing requires npm >= 11.5.1 (see https://docs.npmjs.com/trusted-publishers/).
          # Node 24 bundles npm >= 11.6.1; this step fails closed if the runner's bundled npm is insufficient.
          MIN_NPM_VERSION="11.5.1"
          ACTUAL_NPM_VERSION=$(npm --version)
          # Dependency-free semver compare that fails before any mutating step.
          if ! node -e '
            const [actual, min] = [process.argv[1], process.argv[2]];
            const parse = (v) => {
              const [core, ...pre] = (v || "").trim().replace(/^v/, "").split("-");
              const [maj = 0, min = 0, pat = 0] = core.split(".").map(Number);
              return { maj, min, pat, pre: pre.join("-") };
            };
            const a = parse(actual);
            const m = parse(min);
            const cmp = (a.maj - m.maj) || (a.min - m.min) || (a.pat - m.pat);
            if (cmp < 0 || (cmp === 0 && a.pre && !m.pre)) {
              process.exit(1);
            }
          ' "$ACTUAL_NPM_VERSION" "$MIN_NPM_VERSION"; then
            echo "::error::Bundled npm version ${ACTUAL_NPM_VERSION} does not meet the minimum required version ${MIN_NPM_VERSION} for npm OIDC Trusted Publishing (see https://docs.npmjs.com/trusted-publishers/)."
            exit 1
          fi
          echo "Verified npm version: ${ACTUAL_NPM_VERSION} (meets minimum ${MIN_NPM_VERSION} for OIDC Trusted Publishing)"

      - name: Determine version bump
        id: bump
        run: |
          # Get the latest commit message(s) since last published version
          # Check if there's a previous commit to compare against
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s")
            BODIES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%B")
          else
            LOG=$(git log -1 --pretty=format:"%s")
            BODIES=$(git log -1 --pretty=format:"%B")
          fi

          # Default to none
          BUMP="none"

          # Check for breaking change indicator in subject or commit body
          if echo "$LOG" | grep -qE "^[a-z]+(\(.+\))?!:" || echo "$BODIES" | grep -qE "^BREAKING[ -]CHANGE:"; then
            BUMP="major"
          # Check for feature commits
          elif echo "$LOG" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          # Check for fix or perf commits
          elif echo "$LOG" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            BUMP="patch"
          fi

          # Dry-run rehearsal: if bump is none and DRY_RUN is true, simulate a patch bump so the
          # dry-run workflow exercises version stamping, package inspection, and dry-run publishing.
          if [ "$BUMP" = "none" ] && [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run rehearsal: detected bump is 'none', using 'patch' for rehearsal"
            BUMP="patch"
          fi

          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Detected bump level: ${BUMP}"

      - name: Bump version
        if: steps.bump.outputs.bump != 'none'
        id: version
        env:
          BUMP_LEVEL: ${{ steps.bump.outputs.bump }}
        run: |
          # Bump the version in package.json (no commit, no tag yet)
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version "$BUMP_LEVEL" --no-git-tag-version --allow-same-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ -f CHANGELOG.md ]; then
            sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${NEW_VERSION}] - $(date -u +%Y-%m-%d)/" CHANGELOG.md
          fi
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${OLD_VERSION} → ${NEW_VERSION}"

      - name: Publish to npm
        if: steps.bump.outputs.bump != 'none'
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE}@${VERSION}" version &>/dev/null; then
            echo "Version ${VERSION} already published — skipping."
            echo "publish=false" >> "$GITHUB_ENV"
          else
            if [ "$DRY_RUN" = "true" ]; then
              npm publish --access public --provenance --dry-run
              echo "Published (dry run) ${PACKAGE}@${VERSION}"
              echo "publish=false" >> "$GITHUB_ENV"
            else
              npm publish --access public --provenance
              echo "Published ${PACKAGE}@${VERSION}"
              echo "publish=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: Commit version bump and tag
        if: steps.bump.outputs.bump != 'none' && env.publish == 'true' && env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
          fi
          git add package.json package-lock.json
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin HEAD:main
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin "v${VERSION}"
