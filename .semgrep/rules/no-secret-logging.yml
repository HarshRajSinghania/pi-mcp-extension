rules:
  # AGENTS.md hard rule 4: never log or surface secrets.
  - id: pi-mcp.no-secret-logging
    languages: [typescript]
    severity: ERROR
    message: >-
      Possible secret in a log or notification (AGENTS.md hard rule 4): tokens, client_secret,
      authorization codes, PKCE verifiers, Authorization headers.
    patterns:
      - pattern-either:
          - pattern: console.error(..., $ARG, ...)
          - pattern: $CTX.ui.notify($ARG, ...)
          - pattern: $CTX.ui.setStatus(..., $ARG, ...)
          - pattern: ui.setStatus(..., $ARG, ...)
          - pattern: notify($ARG, ...)
      - metavariable-pattern:
          metavariable: $ARG
          pattern-either:
            - pattern: $O.access_token
            - pattern: $O.refresh_token
            - pattern: $O.client_secret
            - pattern: $O.code_verifier
            - pattern: $O.codeVerifier
            - pattern: $O.authorizationCode
            - pattern: $O.authorization_code
            - pattern: $O.headers.Authorization
            - pattern: $O.headers["Authorization"]
            - pattern: $O.headers.authorization
            - pattern: $O.headers["authorization"]
            - pattern: $O.headers.get("Authorization")
            - pattern: $O.headers.get("authorization")
            - pattern: access_token
            - pattern: refresh_token
            - pattern: client_secret
            - pattern: code_verifier
            - pattern: codeVerifier
            - pattern: authorizationCode
            - pattern: authorization_code
            - pattern: "`...${$O.access_token}...`"
            - pattern: "`...${$O.refresh_token}...`"
            - pattern: "`...${$O.client_secret}...`"
            - pattern: "`...${$O.code_verifier}...`"
            - pattern: "`...${$O.codeVerifier}...`"
            - pattern: "`...${$O.headers.Authorization}...`"
            - pattern: '`...${$O.headers["Authorization"]}...`'
            - pattern: "`...${$O.headers.authorization}...`"
            - pattern: '`...${$O.headers["authorization"]}...`'
            - pattern: '`...${$O.headers.get("Authorization")}...`'
            - pattern: '`...${$O.headers.get("authorization")}...`'
            - pattern: "`...${$O.authorizationCode}...`"
            - pattern: "`...${$O.authorization_code}...`"
            - pattern: "`...${access_token}...`"
            - pattern: "`...${refresh_token}...`"
            - pattern: "`...${client_secret}...`"
            - pattern: "`...${code_verifier}...`"
            - pattern: "`...${codeVerifier}...`"
            - pattern: "`...${authorizationCode}...`"
            - pattern: "`...${authorization_code}...`"
